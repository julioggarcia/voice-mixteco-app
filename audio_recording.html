<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "outline-variant": "#acb3b4",
              "on-tertiary": "#f5f9fd",
              "on-background": "#2d3435",
              "on-surface": "#2d3435",
              "on-secondary-fixed": "#324053",
              "error-dim": "#4e0309",
              "outline": "#757c7d",
              "surface-container-high": "#e4e9ea",
              "error-container": "#fe8983",
              "surface-container-lowest": "#ffffff",
              "tertiary-container": "#f0f4f8",
              "primary-fixed": "#e2e2e2",
              "secondary-dim": "#465468",
              "primary-container": "#e2e2e2",
              "on-primary-fixed": "#3f3f3f",
              "tertiary-fixed": "#f0f4f8",
              "on-secondary-fixed-variant": "#4e5c71",
              "primary-dim": "#525252",
              "secondary-fixed": "#d5e3fc",
              "secondary-fixed-dim": "#c7d5ed",
              "surface-bright": "#f9f9f9",
              "surface-tint": "#5e5e5e",
              "background": "#f9f9f9",
              "inverse-surface": "#0c0f0f",
              "surface-container-highest": "#dde4e5",
              "surface-container-low": "#f2f4f4",
              "tertiary-fixed-dim": "#e2e6ea",
              "surface-dim": "#d3dbdd",
              "on-secondary": "#f8f8ff",
              "primary-fixed-dim": "#d4d4d4",
              "on-tertiary-fixed-variant": "#62676a",
              "surface": "#f9f9f9",
              "on-tertiary-fixed": "#454a4e",
              "tertiary": "#5b6063",
              "secondary-container": "#d5e3fc",
              "inverse-primary": "#ffffff",
              "on-primary-fixed-variant": "#5b5b5b",
              "on-tertiary-container": "#575c60",
              "surface-variant": "#dde4e5",
              "on-primary-container": "#525252",
              "on-primary": "#f8f8f8",
              "on-error-container": "#752121",
              "on-secondary-container": "#455367",
              "on-error": "#fff7f6",
              "surface-container": "#ebeeef",
              "secondary": "#526074",
              "error": "#9f403d",
              "inverse-on-surface": "#9c9d9d",
              "primary": "#5e5e5e",
              "tertiary-dim": "#4f5457",
              "on-surface-variant": "#596061"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .waveform-bar {
            width: 2px;
            background-color: #2d3435;
            margin: 0 1px;
            transition: height 0.2s ease;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body antialiased">
<!-- Active Recording Screen (Focused View) -->
<!-- Note: Shared TopAppBar/BottomNavBar excluded as per Hierarchy of Focus for Process screens -->
<div class="relative flex min-h-screen w-full flex-col bg-surface overflow-x-hidden">
<!-- Minimal Header for Focused View -->
<header class="flex items-center justify-between p-6">
<button class="flex items-center justify-center p-2 text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<span class="text-[0.65rem] tracking-[0.1em] font-medium text-on-surface-variant uppercase">Status</span>
<div class="flex items-center gap-1.5">
<div class="size-1.5 rounded-full bg-error"></div>
<span class="text-sm font-medium tracking-tight">Recording</span>
</div>
</div>
<div class="size-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex flex-1 flex-col items-center justify-center px-6 pb-24">
<!-- Metadata Context -->
<div class="mb-12 text-center">
<p class="text-[0.7rem] uppercase tracking-[0.15em] text-on-tertiary-fixed-variant mb-2">New Entry</p>
<h1 class="text-xl font-medium tracking-tight">Morning Reflection.wav</h1>
</div>
<!-- Large Digital Timer -->
<div class="flex flex-col items-center justify-center mb-20">
<div class="flex items-baseline gap-1">
<span class="text-[5rem] md:text-[7rem] font-light leading-none tracking-tighter text-on-background">04</span>
<span class="text-[4rem] md:text-[5rem] font-extralight leading-none text-outline-variant">:</span>
<span class="text-[5rem] md:text-[7rem] font-light leading-none tracking-tighter text-on-background">32</span>
</div>
<div class="mt-4 px-4 py-1 bg-surface-container-low rounded-lg">
<span class="text-[0.65rem] uppercase tracking-widest text-on-surface-variant font-semibold">Duration</span>
</div>
</div>
<!-- Minimal Linear Waveform -->
<div class="w-full max-w-2xl h-32 flex items-center justify-center gap-[2px] opacity-80">
<!-- Static wave representation -->
<div class="waveform-bar h-4"></div>
<div class="waveform-bar h-6"></div>
<div class="waveform-bar h-10"></div>
<div class="waveform-bar h-14"></div>
<div class="waveform-bar h-8"></div>
<div class="waveform-bar h-12"></div>
<div class="waveform-bar h-20"></div>
<div class="waveform-bar h-24"></div>
<div class="waveform-bar h-16"></div>
<div class="waveform-bar h-28"></div>
<div class="waveform-bar h-32"></div>
<div class="waveform-bar h-24"></div>
<div class="waveform-bar h-28"></div>
<div class="waveform-bar h-20"></div>
<div class="waveform-bar h-12"></div>
<div class="waveform-bar h-16"></div>
<div class="waveform-bar h-24"></div>
<div class="waveform-bar h-10"></div>
<div class="waveform-bar h-8"></div>
<div class="waveform-bar h-6"></div>
<div class="waveform-bar h-4"></div>
<div class="waveform-bar h-12"></div>
<div class="waveform-bar h-18"></div>
<div class="waveform-bar h-24"></div>
<div class="waveform-bar h-14"></div>
<div class="waveform-bar h-20"></div>
<div class="waveform-bar h-22"></div>
<div class="waveform-bar h-16"></div>
<div class="waveform-bar h-10"></div>
<div class="waveform-bar h-6"></div>
</div>
</main>
<!-- Floating Control Area -->
<footer class="fixed bottom-12 left-0 right-0 flex justify-center px-6">
<div class="flex items-center gap-8 bg-surface-container-lowest/80 backdrop-blur-xl px-10 py-6 rounded-full border border-outline-variant/10 shadow-2xl flex items-center gap-12">
<!-- Secondary Action: Marker -->
<!-- Primary Action: Stop -->
<button class="relative flex items-center justify-center size-20 rounded-full bg-on-background text-surface hover:opacity-90 transition-all active:scale-95 group">
<span class="material-symbols-outlined !text-3xl" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;">stop</span>
</button>
<!-- Secondary Action: Pause -->
<button class="flex items-center justify-center size-14 rounded-full border border-outline-variant/30 text-on-surface hover:bg-surface-container-low transition-all active:scale-95 group">
<span class="material-symbols-outlined !text-2xl">pause</span>
</button>
</div>
</footer>
<!-- Background Tonal Decoration -->
<div class="absolute -top-24 -right-24 size-96 bg-surface-container rounded-full blur-3xl opacity-40 -z-10"></div>
<div class="absolute bottom-48 -left-12 size-64 bg-surface-container-high rounded-full blur-[80px] opacity-30 -z-10"></div>
</div>
</body></html>
